<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Java 1</title>
</head>

<body>

    <label>numri i pare</label>
    <input type="number" id="nr1">
    <br>

    <label>numri dyte</label>
    <input type="number" id="nr2">
    <br>

<button type="submit" onclick="sum()"> + </button>
    <p id="result"></p>
<button type="submit" onclick="times()"> * </button>
    <p id="times"></p>
    <button type="submit" onclick="divide()"> / </button>
    <p id="divide"></p>
    <script>
        function sum() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            var c = a + b;

            document.getElementById('result').innerHTML = c;
        }
        function times() 
        {
              var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
               var c = a * b;
             document.getElementById('times').innerHTML = c;
        }
        function divide()
             {
              var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);
                 if (b==0){
                                  document.getElementById('divide').innerHTML = "nuk pjestohet me 0";}
                     else{
                     var c = a / b;
             document.getElementById('divide').innerHTML = c;
        }
    </script>

</body>
</html>
